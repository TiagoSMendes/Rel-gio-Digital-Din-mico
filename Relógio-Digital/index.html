<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Tiago Mendes">
    <meta name="description" content="Relógio digital dinâmico com data e cores que mudam conforme a hora do dia.">
    <meta name="keywords" content="Relógio, Relógio Digital">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏰</text></svg>">

    <link rel="stylesheet" href="css/style.css">

    <title>Relógio Digital</title>
</head>

<body>
    <main>
        <p class="saudacao" id="saudacao">Olá!</p>

        <div class="relogio" role="timer" aria-live="off" aria-label="Hora atual">
            <div>
                <span id="horas">00</span>
                <span class="tempo">Horas</span>
            </div>

            <div>
                <span id="minutos">00</span>
                <span class="tempo">Minutos</span>
            </div>

            <div>
                <span id="segundos">00</span>
                <span class="tempo">Segundos</span>
            </div>
        </div>

        <p class="data" id="data"></p>
    </main>

    <script src="js/script.js"></script>
</body>

</html>
